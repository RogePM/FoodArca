<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- soft clay disc -->
  <circle cx="60" cy="62" r="45" fill="#f6d3c2"/>
  <!-- hand behind the phone -->
  <path d="M84 60 C94 65 100 77 102 91 L92 99 L84 99 Z" fill="#f4bea2" stroke="#2b3640" stroke-width="2.5"/>
  <!-- phone: dark bezel, white screen -->
  <rect x="36" y="12" width="48" height="92" rx="12" fill="#3a4651" stroke="#2b3640" stroke-width="2.5"/>
  <rect x="40" y="16" width="40" height="84" rx="8.5" fill="#ffffff"/>
  <rect x="52" y="16" width="16" height="4.5" rx="2.25" fill="#3a4651"/>
  <path d="M34.5 32 v7 M34.5 43 v7" stroke="#2b3640" stroke-width="2"/>
  <!-- scan corners -->
  <path d="M45 42 v-4.5 h4.5 M70.5 37.5 h4.5 v4.5 M75 75 v4.5 h-4.5 M49.5 79.5 h-4.5 v-4.5" stroke="#d97757" stroke-width="2.6"/>
  <!-- the item in view: a can, no barcode -->
  <path d="M50 47 v23 c0 1.7 4.5 3 10 3 s10 -1.3 10 -3 v-23" fill="#ffffff" stroke="#2b3640" stroke-width="2.2"/>
  <path d="M50 54 c0 1.4 4.5 2.5 10 2.5 s10 -1.1 10 -2.5 v10 c0 1.4 -4.5 2.5 -10 2.5 s-10 -1.1 -10 -2.5 Z" fill="#f3c4ae" stroke="#2b3640" stroke-width="2.2"/>
  <ellipse cx="60" cy="47" rx="10" ry="2.8" fill="#ffffff" stroke="#2b3640" stroke-width="2.2"/>
  <!-- scan line with a soft glow -->
  <path d="M42 60.5 h36" stroke="#d97757" stroke-width="7" opacity="0.2"/>
  <path d="M42 60.5 h36" stroke="#d97757" stroke-width="2.4"/>
  <!-- finger on the left edge -->
  <path d="M37 69 c-6.5 -0.6 -11 2 -11 5.8 s4.5 6.4 11 5.8" fill="#f4bea2" stroke="#2b3640" stroke-width="2.5"/>
  <!-- thumb in front -->
  <path d="M59 113 L55.5 96 c-1.3 -6 1.7 -10.2 6.6 -10.6 c4.9 -0.4 7.9 2.6 8.9 7.6 L74.5 111" fill="#f4bea2" stroke="#2b3640" stroke-width="2.5"/>
  <path d="M58 93.5 c1.3 -2.6 3.4 -3.8 6.2 -3.6" stroke="#2b3640" stroke-width="1.8" opacity="0.7"/>
  <!-- remove badge -->
  <circle cx="85" cy="22" r="10" fill="#d97757" stroke="#ffffff" stroke-width="3"/>
  <path d="M80.5 22 h9" stroke="#ffffff" stroke-width="2.8"/>
</svg>
